apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-service
  namespace: docuai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nlp-service
  template:
    metadata:
      labels:
        app: nlp-service
    spec:
      containers:
        - name: nlp
          image: docuai/nlp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: docuai-config
            - secretRef:
                name: docuai-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: nlp-service
  namespace: docuai
spec:
  selector:
    app: nlp-service
  ports:
    - port: 8002
      targetPort: 8002