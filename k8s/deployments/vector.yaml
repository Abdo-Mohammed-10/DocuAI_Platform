apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-service
  namespace: docuai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-service
  template:
    metadata:
      labels:
        app: vector-service
    spec:
      containers:
        - name: vector
          image: docuai/vector:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: docuai-config
            - secretRef:
                name: docuai-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: vector-service
  namespace: docuai
spec:
  selector:
    app: vector-service
  ports:
    - port: 8003
      targetPort: 8003