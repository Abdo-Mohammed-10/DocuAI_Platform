apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: docuai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: docuai/frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          env:
            - name: API_BASE_URL
              value: "http://api-gateway-service:8000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: docuai
spec:
  selector:
    app: frontend
  ports:
    - port: 8501
      targetPort: 8501
  type: NodePort