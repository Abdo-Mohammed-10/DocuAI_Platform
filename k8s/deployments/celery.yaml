apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: docuai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery
          image: docuai/ingestion:latest
          imagePullPolicy: Never
          command:
            - celery
            - -A
            - shared.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
          envFrom:
            - configMapRef:
                name: docuai-config
            - secretRef:
                name: docuai-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"