apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: docuai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion
          image: docuai/ingestion:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: docuai-config
            - secretRef:
                name: docuai-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: docuai
spec:
  selector:
    app: ingestion-service
  ports:
    - port: 8001
      targetPort: 8001