name: CD — Staging

on:
  push:
    branches: [main]

jobs:
  # ── Job 1: Run Tests ──────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: sec DocuAI
    env:
      DB_PASSWORD:       ${{ secrets.DB_PASSWORD }}
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      SECRET_KEY:        ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install uv
      - run: uv pip install --system -r requirements/dev.txt
      - run: ruff check .
      - run: pytest tests/ -v

  # ── Job 2: Build & Push Images ────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    environment: sec DocuAI
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push — API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api_gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-api-gateway:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-api-gateway:latest

      - name: Build & Push — Ingestion
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ingestion_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-ingestion:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-ingestion:latest

      - name: Build & Push — NLP
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/nlp_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-nlp:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-nlp:latest

      - name: Build & Push — Vector
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/vector_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-vector:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-vector:latest

      - name: Build & Push — Analytics
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/analytics_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-analytics:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-analytics:latest

      - name: Build & Push — Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/streamlit_app/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-frontend:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-frontend:latest

  # ── Job 3: Deploy to EKS ──────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    environment: sec DocuAI

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Create namespace
        run: |
          kubectl create namespace docuai --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply ConfigMap
        env:
          DB_ENDPOINT: ${{ secrets.DB_ENDPOINT }}
          REDIS_ENDPOINT: ${{ secrets.REDIS_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          kubectl create configmap docuai-config \
            --namespace=docuai \
            --from-literal=APP_ENV=staging \
            --from-literal=POSTGRES_HOST="$DB_ENDPOINT" \
            --from-literal=POSTGRES_PORT=5432 \
            --from-literal=POSTGRES_DB=docuai_db \
            --from-literal=POSTGRES_USER=postgres \
            --from-literal=REDIS_HOST="$REDIS_ENDPOINT" \
            --from-literal=REDIS_PORT=6379 \
            --from-literal=AWS_S3_BUCKET="$S3_BUCKET" \
            --from-literal=AWS_REGION="${{ secrets.AWS_REGION }}" \
            --from-literal=INGESTION_URL=http://ingestion-service:8001 \
            --from-literal=NLP_URL=http://nlp-service:8002 \
            --from-literal=VECTOR_URL=http://vector-service:8003 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
        run: |
          kubectl create secret generic docuai-secrets \
            --namespace=docuai \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=SECRET_KEY="$SECRET_KEY" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=LANGCHAIN_API_KEY="$LANGCHAIN_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 🔍 List deployment files
        run: |
          echo "=== Files in k8s/deployments/ ==="
          ls -la k8s/deployments/
          echo ""
          echo "=== All YAML files in k8s/ ==="
          find k8s/ -name "*.yaml" -o -name "*.yml"

      - name: Update image tags in deployments
        run: |
          IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          ECR=${{ secrets.ECR_REGISTRY }}
          DEPLOY_DIR="k8s/deployments"
          
          echo "Updating deployments with tag: $IMAGE_TAG"
          
          # API Gateway
          if [ -f "$DEPLOY_DIR/api-gateway.yaml" ]; then
            echo "✅ Updating api-gateway..."
            sed -i "s|image:.*docuai-api-gateway.*|image: ${ECR}/docuai-api-gateway:${IMAGE_TAG}|g" $DEPLOY_DIR/api-gateway.yaml
          else
            echo "⚠️ api-gateway.yaml not found, skipping..."
          fi
          
          # Ingestion
          if [ -f "$DEPLOY_DIR/ingestion.yaml" ]; then
            echo "✅ Updating ingestion..."
            sed -i "s|image:.*docuai-ingestion.*|image: ${ECR}/docuai-ingestion:${IMAGE_TAG}|g" $DEPLOY_DIR/ingestion.yaml
          else
            echo "⚠️ ingestion.yaml not found, skipping..."
          fi
          
          # NLP
          if [ -f "$DEPLOY_DIR/nlp.yaml" ]; then
            echo "✅ Updating nlp..."
            sed -i "s|image:.*docuai-nlp.*|image: ${ECR}/docuai-nlp:${IMAGE_TAG}|g" $DEPLOY_DIR/nlp.yaml
          else
            echo "⚠️ nlp.yaml not found, skipping..."
          fi
          
          # Vector
          if [ -f "$DEPLOY_DIR/vector.yaml" ]; then
            echo "✅ Updating vector..."
            sed -i "s|image:.*docuai-vector.*|image: ${ECR}/docuai-vector:${IMAGE_TAG}|g" $DEPLOY_DIR/vector.yaml
          else
            echo "⚠️ vector.yaml not found, skipping..."
          fi
          
          # Analytics
          if [ -f "$DEPLOY_DIR/analytics.yaml" ]; then
            echo "✅ Updating analytics..."
            sed -i "s|image:.*docuai-analytics.*|image: ${ECR}/docuai-analytics:${IMAGE_TAG}|g" $DEPLOY_DIR/analytics.yaml
          else
            echo "⚠️ analytics.yaml not found, skipping..."
          fi
          
          # Frontend
          if [ -f "$DEPLOY_DIR/frontend.yaml" ]; then
            echo "✅ Updating frontend..."
            sed -i "s|image:.*docuai-frontend.*|image: ${ECR}/docuai-frontend:${IMAGE_TAG}|g" $DEPLOY_DIR/frontend.yaml
          else
            echo "⚠️ frontend.yaml not found, skipping..."
          fi
          
          # Change imagePullPolicy
          find $DEPLOY_DIR -name "*.yaml" -exec sed -i "s|imagePullPolicy: Never|imagePullPolicy: Always|g" {} \;
          
          echo ""
          echo "=== Updated images ==="
          grep -r "image:" $DEPLOY_DIR/ 2>/dev/null || echo "No image lines found"

      - name: Deploy all services
        run: |
          echo "=== Deploying services ==="
          echo "Files to deploy:"
          ls -la k8s/deployments/
          
          kubectl apply -f k8s/deployments/
          
          echo "Waiting 15 seconds for pods to start..."
          sleep 15
          
          echo "=== Initial Pod Status ==="
          kubectl get pods -n docuai -o wide

      - name: Wait for rollout
        run: |
          # Get list of deployments from actual files
          cd k8s/deployments/
          for file in *.yaml; do
            if [ -f "$file" ]; then
              svc=$(echo $file | sed 's/\.yaml$//')
              echo "⏳ Waiting for $svc rollout..."
              if kubectl rollout status deployment/$svc -n docuai --timeout=600s; then
                echo "✅ $svc deployed successfully!"
              else
                echo "❌ $svc deployment failed!"
                echo ""
                echo "=== Pod Description ==="
                kubectl describe pod -n docuai -l app=$svc 2>&1 || true
                echo ""
                echo "=== Pod Logs ==="
                kubectl logs -n docuai -l app=$svc --tail=100 2>&1 || true
                echo ""
                echo "=== Events ==="
                kubectl get events -n docuai --sort-by='.lastTimestamp' | tail -20
                exit 1
              fi
            fi
          done

      - name: Get service URLs
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "  🚀 Deployment Complete!"
          echo "=========================================="
          echo ""
          echo "=== Services ==="
          kubectl get services -n docuai
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n docuai -o wide
          echo ""
          echo "=== ConfigMaps ==="
          kubectl get configmap -n docuai
          echo ""
          echo "=== Secrets ==="
          kubectl get secret -n docuai
