name: CD — Staging

on:
  push:
    branches: [main]

jobs:
  # ── Job 1: Run Tests ──────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: sec DocuAI
    env:
      DB_PASSWORD:       ${{ secrets.DB_PASSWORD }}
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      SECRET_KEY:        ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install uv
      - run: uv pip install --system -r requirements/dev.txt
      - run: ruff check .
      - run: pytest tests/ -v

  # ── Job 2: Build & Push Images ────────────────────────────
   build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    environment: sec DocuAI
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push — API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api_gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-api-gateway:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-api-gateway:latest

      - name: Build & Push — Ingestion
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ingestion_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-ingestion:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-ingestion:latest

      - name: Build & Push — NLP
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/nlp_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-nlp:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-nlp:latest

      - name: Build & Push — Vector
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/vector_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-vector:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-vector:latest

      - name: Build & Push — Analytics
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/analytics_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-analytics:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-analytics:latest

      - name: Build & Push — Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/streamlit_app/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/docuai-frontend:${{ steps.tag.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/docuai-frontend:latest

 # ── Job 3: Deploy to EKS ──────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    environment: sec DocuAI

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Create namespace
        run: |
          kubectl create namespace docuai --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply ConfigMap
        env:
          DB_ENDPOINT: ${{ secrets.DB_ENDPOINT }}
          REDIS_ENDPOINT: ${{ secrets.REDIS_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          kubectl create configmap docuai-config \
            --namespace=docuai \
            --from-literal=APP_ENV=staging \
            --from-literal=POSTGRES_HOST="$DB_ENDPOINT" \
            --from-literal=POSTGRES_PORT=5432 \
            --from-literal=POSTGRES_DB=docuai_db \
            --from-literal=POSTGRES_USER=postgres \
            --from-literal=REDIS_HOST="$REDIS_ENDPOINT" \
            --from-literal=REDIS_PORT=6379 \
            --from-literal=AWS_S3_BUCKET="$S3_BUCKET" \
            --from-literal=AWS_REGION="${{ secrets.AWS_REGION }}" \
            --from-literal=INGESTION_URL=http://ingestion-service:8001 \
            --from-literal=NLP_URL=http://nlp-service:8002 \
            --from-literal=VECTOR_URL=http://vector-service:8003 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
        run: |
          kubectl create secret generic docuai-secrets \
            --namespace=docuai \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=SECRET_KEY="$SECRET_KEY" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=LANGCHAIN_API_KEY="$LANGCHAIN_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 🧹 Clean up old resources
        run: |
          echo "=== Deleting failed/pending pods ==="
          kubectl delete pod -n docuai --field-selector=status.phase=Failed 2>/dev/null || true
          kubectl delete pod -n docuai --field-selector=status.phase=Pending --grace-period=0 --force 2>/dev/null || true
          
          echo "=== Scaling down old deployments ==="
          kubectl scale deployment -n docuai --all --replicas=0 2>/dev/null || true
          
          sleep 10
          
          echo "=== Current pods ==="
          kubectl get pods -n docuai 2>/dev/null || echo "No pods"

      - name: Deploy and update images
        run: |
          IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          ECR=${{ secrets.ECR_REGISTRY }}
          
          echo "=== Applying deployment files ==="
          kubectl apply -f k8s/deployments/
          
          sleep 5
          
          echo "=== Updating images ==="
          
          kubectl set image deployment/api-gateway \
            api-gateway=${ECR}/docuai-api-gateway:${IMAGE_TAG} \
            -n docuai 2>/dev/null && echo "✅ api-gateway updated" || echo "⚠️ api-gateway not found"
          
          kubectl set image deployment/ingestion-service \
            ingestion-service=${ECR}/docuai-ingestion:${IMAGE_TAG} \
            -n docuai 2>/dev/null && echo "✅ ingestion-service updated" || echo "⚠️ ingestion-service not found"
          
          kubectl set image deployment/nlp-service \
            nlp-service=${ECR}/docuai-nlp:${IMAGE_TAG} \
            -n docuai 2>/dev/null && echo "✅ nlp-service updated" || echo "⚠️ nlp-service not found"
          
          kubectl set image deployment/vector-service \
            vector-service=${ECR}/docuai-vector:${IMAGE_TAG} \
            -n docuai 2>/dev/null && echo "✅ vector-service updated" || echo "⚠️ vector-service not found"
          
          kubectl set image deployment/frontend \
            frontend=${ECR}/docuai-frontend:${IMAGE_TAG} \
            -n docuai 2>/dev/null && echo "✅ frontend updated" || echo "⚠️ frontend not found"

      - name: Wait for rollout
        run: |
          echo "Waiting 30 seconds for pods to start..."
          sleep 30
          
          echo "=== Pod Status ==="
          kubectl get pods -n docuai -o wide
          
          echo ""
          echo "=== Checking deployments ==="
          for deploy in $(kubectl get deployment -n docuai -o jsonpath='{.items[*].metadata.name}'); do
            echo "⏳ Waiting for $deploy..."
            if kubectl rollout status deployment/$deploy -n docuai --timeout=600s; then
              echo "✅ $deploy deployed successfully!"
            else
              echo "❌ $deploy failed!"
              echo "=== Describe ==="
              kubectl describe deployment $deploy -n docuai
              echo "=== Pod Logs ==="
              kubectl logs -n docuai -l app=$deploy --tail=50 --all-containers=true 2>&1 || true
              echo "=== Events ==="
              kubectl get events -n docuai --sort-by='.lastTimestamp' | tail -10
              exit 1
            fi
          done

      - name: Get service URLs
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "  🚀 Deployment Complete!"
          echo "=========================================="
          echo ""
          echo "=== Services ==="
          kubectl get services -n docuai
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n docuai -o wide
          echo ""
          echo "=== Resource Usage ==="
          kubectl top pods -n docuai 2>/dev/null || echo "metrics-server not available"
