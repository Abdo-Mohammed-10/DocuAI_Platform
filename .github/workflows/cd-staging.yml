name: CD — Staging

on:
  push:
    branches: [main]

env:
  AWS_REGION:       ${{ secrets.AWS_REGION }}
  ECR_REGISTRY:     ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  # ── Job 1: Run Tests ──────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: sec DocuAI
    env:
      DB_PASSWORD:       ${{ secrets.DB_PASSWORD }}
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      SECRET_KEY:        ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv pip install --system -r requirements/dev.txt
      - run: ruff check .
      - run: pytest tests/ -v

  # ── Job 2: Build & Push Images ────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    environment: sec DocuAI
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push — API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api_gateway/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/docuai-api-gateway:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/docuai-api-gateway:latest

      - name: Build & Push — Ingestion
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ingestion_service/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/docuai-ingestion:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/docuai-ingestion:latest

      - name: Build & Push — NLP
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/nlp_service/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/docuai-nlp:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/docuai-nlp:latest

      - name: Build & Push — Vector
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/vector_service/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/docuai-vector:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/docuai-vector:latest

      - name: Build & Push — Analytics
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/analytics_service/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/docuai-analytics:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/docuai-analytics:latest

      - name: Build & Push — Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/streamlit_app/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/docuai-frontend:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/docuai-frontend:latest

  # ── Job 3: Deploy to EKS ──────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    environment: sec DocuAI

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Create namespace
        run: |
          kubectl create namespace docuai --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply ConfigMap
        env:
          DB_ENDPOINT: ${{ secrets.DB_ENDPOINT }}
          REDIS_ENDPOINT: ${{ secrets.REDIS_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          kubectl create configmap docuai-config \
            --namespace=docuai \
            --from-literal=APP_ENV=production \
            --from-literal=POSTGRES_HOST="$DB_ENDPOINT" \
            --from-literal=POSTGRES_PORT=5432 \
            --from-literal=POSTGRES_DB=docuai_db \
            --from-literal=POSTGRES_USER=postgres \
            --from-literal=REDIS_HOST="$REDIS_ENDPOINT" \
            --from-literal=REDIS_PORT=6379 \
            --from-literal=AWS_S3_BUCKET="$S3_BUCKET" \
            --from-literal=AWS_REGION="$AWS_REGION" \
            --from-literal=INGESTION_URL=http://ingestion-service:8001 \
            --from-literal=NLP_URL=http://nlp-service:8002 \
            --from-literal=VECTOR_URL=http://vector-service:8003 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
        run: |
          kubectl create secret generic docuai-secrets \
            --namespace=docuai \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=SECRET_KEY="$SECRET_KEY" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=LANGCHAIN_API_KEY="$LANGCHAIN_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy all services
        run: |
          find k8s/deployments/ -name "*.yaml" \
            -exec sed -i "s|imagePullPolicy: Never|imagePullPolicy: Always|g" {} \;
          kubectl apply -f k8s/deployments/

      - name: Wait for rollout
        run: |
          for svc in api-gateway ingestion-service nlp-service vector-service frontend; do
            kubectl rollout status deployment/$svc -n docuai --timeout=300s
          done

      - name: Get service URLs
        run: |
          kubectl get services -n docuai
          kubectl get pods -n docuai
