services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: DocuAI_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: DocuAI

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: DocuAI_redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: services/ingestion_service/Dockerfile
    container_name: DocuAI_backend

    ports:
      - "8000:8000"

    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres

    volumes:
      - .:/app

    working_dir: /app

    depends_on:
      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: services/ingestion_service/Dockerfile

    container_name: DocuAI_celery

    command: celery -A shared.celery_app worker --loglevel=info --concurrency=2

    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres

    volumes:
      - .:/app

    working_dir: /app

    depends_on:
      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    container_name: DocuAI_flower

    command: celery --broker=redis://redis:6379/0 flower --port=5555

    ports:
      - "5555:5555"

    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: DocuAI_nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: DocuAI_mlflow
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
      
  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
  
  minio:
    image: minio/minio

volumes:
  postgres_data:
  mlflow_data:    